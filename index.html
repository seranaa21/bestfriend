<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Memory For You</title>

<style>

/* ===== BACKGROUND ===== */
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background: radial-gradient(circle at top,#ffb3c6,#ff4d6d,#590d22);
  color:white;
}

/* ===== OPENING ===== */
#startScreen{
  position:fixed;
  inset:0;
  background: radial-gradient(circle,#ff4d6d,#590d22);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  color:white;
}

#startScreen button{
  padding:12px 20px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== CARD ===== */
.container{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:90%;
  max-width:380px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  padding:25px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

/* ===== SLIDE ===== */
.slide{display:none;}
.slide.active{display:block;}

img{
  width:100%;
  border-radius:18px;
  margin-bottom:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  border:3px solid rgba(255,255,255,0.2);
}

/* ===== BUTTON ===== */
button{
  border:none;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  background:white;
  color:#c9184a;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
}

.dot.active{
  background:white;
  box-shadow:0 0 10px white;
}

/* ===== LOVE / ROSE / STAR ===== */
.heart,.rose,.star{
  position:fixed;
  top:-10px;
  pointer-events:none;
  z-index:999;
  animation:fall linear forwards;
}

.heart{color:#ff4d6d;font-size:20px;}
.rose{font-size:18px;}
.star{color:white;font-size:12px;}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

/* ===== LETTER ===== */
#letterBox{
  position:fixed;
  bottom:-300px;
  left:50%;
  transform:translateX(-50%);
  width:85%;
  max-width:350px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:20px;
  text-align:center;
  transition:0.8s;
}

/* ===== STARS ===== */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:-1;
}

.starbg{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:0.5;
}

</style>
</head>

<body>

<!-- OPENING -->
<div id="startScreen">
  <h1>💖 Memory For You 💖</h1>
  <button onclick="start()">ENTER</button>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<!-- STARS -->
<div class="stars"></div>

<!-- LETTER -->
<div id="letterBox">
💌<br><br>
You are my favorite memory.<br>
<small>— someone who cares about you</small>
</div>

<!-- CONTENT -->
<div class="container">
<div class="card">

  <h2>Memory</h2>

  <div class="slide active">
    <img src="foto1.jpeg">
    <p>I have faith in what I see.</p>
  </div>

  <div class="slide">
    <img src="foto2.jpeg">
    <p>Now I know I met an angel.</p>
  </div>

  <div class="slide">
    <img src="foto3.jpeg">
    <p>She looks perfect.</p>
  </div>

  <div class="slide">
    <img src="foto4.jpeg">
    <p>You look perfect tonight.</p>
  </div>

  <div class="controls">
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>
</div>

<script>

/* ===== START ===== */
function start(){
  document.getElementById("startScreen").style.display="none";
  const music=document.getElementById("music");
  music.play().catch(()=>{});
}

/* ===== SLIDE ===== */
let index=0;
const slides=document.querySelectorAll(".slide");
const dots=document.querySelectorAll(".dot");

function show(n){
  index=(n+slides.length)%slides.length;

  slides.forEach(s=>s.classList.remove("active"));
  dots.forEach(d=>d.classList.remove("active"));

  slides[index].classList.add("active");
  dots[index].classList.add("active");
}

function next(){show(index+1)}
function prev(){show(index-1)}

setInterval(()=>show(index+1),4000);

/* ===== LOVE / ROSE / STAR ===== */
function spawn(type,emoji,size){
  const el=document.createElement("div");
  el.classList.add(type);
  el.innerHTML=emoji;
  el.style.left=Math.random()*window.innerWidth+"px";
  el.style.fontSize=(Math.random()*20+10)+"px";
  el.style.animationDuration=(Math.random()*3+2)+"s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),5000);
}

setInterval(()=>spawn("heart","❤️"),250);
setInterval(()=>spawn("rose","🌹"),600);
setInterval(()=>spawn("star","✨"),200);

/* ===== LETTER POPUP ===== */
setTimeout(()=>{
  document.getElementById("letterBox").style.bottom="30px";
},3000);

/* ===== STAR BACKGROUND ===== */
function createStars(){
  const container=document.querySelector(".stars");

  for(let i=0;i<80;i++){
    const s=document.createElement("div");
    s.classList.add("starbg");

    s.style.top=Math.random()*100+"%";
    s.style.left=Math.random()*100+"%";
    s.style.opacity=Math.random();

    container.appendChild(s);
  }
}
createStars();

</script>

</body>
</html>
